<!DOCTYPE html>
<html lang="si">
<head>

    <meta charset="UTF-8">
    <title>පුරෝකථන ප්‍රතිඵලය</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Poppins', sans-serif;
            background-image: linear-gradient(rgba(10, 25, 15, 0.75), rgba(10, 25, 15, 0.75)), url("{{ url_for('static', filename='agromind_3d.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }

        .result-card {
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            background: rgba(20, 35, 25, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 45px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.6s ease-in-out;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #4ade80;
        }

        .result {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #a3e635, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 20px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .subtitle {
            color: #a7f3d0;
            margin-top: 10px;
        }

        .btn-custom {
            margin-top: 25px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #052e16;
            font-weight: 700;
            padding: 12px 25px;
            border-radius: 12px;
            border: none;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3);
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.5);
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: #ffffff;
        }

        .emoji {
            font-size: 40px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>

</head>

<body>

<div class="result-card">

    <div class="text-center mb-3">
        <img src="{{ url_for('static', filename='agromind_logo.png') }}" alt="AgroMind AI Logo" class="img-fluid" style="max-height: 85px; border-radius: 50%; box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4); border: 2px solid rgba(255, 255, 255, 0.2);">
    </div>

    <div class="title">
        ඔබට සුදුසු බෝගය
    </div>

    <div class="result">
        {{ prediction_text }}
    </div>

    <div class="subtitle">
        AI පද්ධතිය විසින් විශ්ලේෂණය කරන ලදී
    </div>

    <a href="/" class="btn-custom">
        🔄 නැවත උත්සාහ කරන්න
    </a>

</div>

</body>
</html>
