<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>AgroMind AI - ගොවි බුද්ධිමත් පද්ධතිය</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: linear-gradient(rgba(10, 25, 15, 0.75), rgba(10, 25, 15, 0.75)), url("{{ url_for('static', filename='agromind_3d.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
        }

        .main-title {
            font-weight: 800;
            background: linear-gradient(135deg, #a3e635, #4ade80);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 40px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .subtitle {
            color: #a7f3d0;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .card {
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 35px;
            background: rgba(20, 35, 25, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 45px rgba(0,0,0,0.4);
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff !important;
            transition: 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #4ade80;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.35);
            color: #ffffff !important;
        }

        .btn-custom {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: #052e16;
            font-weight: 700;
            padding: 14px;
            border-radius: 12px;
            border: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3);
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 222, 128, 0.5);
            background: linear-gradient(135deg, #22c55e, #15803d);
            color: #ffffff;
        }

        .container-box {
            max-width: 650px;
            margin: auto;
            padding-bottom: 50px;
        }

        .emoji {
            font-size: 28px;
        }
    </style>

</head>

<body>

<div class="container container-box">

    <!-- Logo Header -->
    <div class="text-center mt-5 mb-2">
        <img src="{{ url_for('static', filename='agromind_logo.png') }}" alt="AgroMind AI Logo" class="img-fluid" style="max-height: 100px; border-radius: 50%; box-shadow: 0 4px 20px rgba(74, 222, 128, 0.4); border: 2px solid rgba(255, 255, 255, 0.3);">
    </div>

    <!-- Title -->
    <h1 class="text-center main-title mt-0">
        AgroMind AI
    </h1>

    <p class="text-center subtitle">
        ගොවි බුද්ධිමත් AI පද්ධතිය - හොඳම බෝගය පුරෝකථනය කරන්න
    </p>

    <!-- 3D Photo Banner -->
    <div class="text-center my-4">
        <img src="{{ url_for('static', filename='agromind_3d.png') }}" alt="AgroMind AI 3D Smart Farming" class="img-fluid rounded-4 shadow-sm" style="max-height: 280px; width: 100%; object-fit: cover; border: 4px solid white;">
    </div>

    <!-- Card -->
    <div class="card mt-4">

        <form action="/predict" method="POST">

            <input type="text" name="N" class="form-control mb-3" placeholder=" නයිට්‍රජන් (Nitrogen)">

            <input type="text" name="P" class="form-control mb-3" placeholder=" පොස්ෆරස් (Phosphorus)">

            <input type="text" name="K" class="form-control mb-3" placeholder=" පොටෑසියම් (Potassium)">

            <input type="text" name="temperature" class="form-control mb-3" placeholder=" උෂ්ණත්වය (Temperature)">

            <input type="text" name="humidity" class="form-control mb-3" placeholder="ආර්ද්‍රතාවය (Humidity)">

            <input type="text" name="ph" class="form-control mb-3" placeholder=" පී.එච් අගය (pH Value)">

            <input type="text" name="rainfall" class="form-control mb-3" placeholder=" වර්ෂාපතනය (Rainfall)">

            <button type="submit" class="btn btn-custom w-100 mt-2">
                 බෝගය පුරෝකථනය කරන්න
            </button>

        </form>

    </div>

    <!-- Footer -->
    <p class="text-center mt-4 text-muted">
        © 2026 AgroMind AI | Smart Agriculture System
    </p>

</div>

</body>
</html>
